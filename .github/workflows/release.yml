name: Build and publish

# Builds a tagged version of selfchat/client for every platform, signs the
# updates, and publishes them here with the update feed (latest.json).
#
# Normally automatic: merging a pull request in selfchat/client bumps the
# version, tags it, and pushes the same tag here, with the release notes as
# the tag's message. That push starts this workflow.
#
# By hand:
#   gh workflow run release.yml -R selfchat/client-releases -f tag=v0.1.0
#
# Test build of any branch, nothing published:
#   gh workflow run release.yml -R selfchat/client-releases -f tag=my-branch -f publish=false

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "selfchat/client tag to build, e.g. v0.1.0 (or a branch, for a test build)"
        required: true
      publish:
        description: "Publish a release. Off: build only, to test."
        type: boolean
        default: true

permissions:
  contents: write

env:
  # The selfchat/client tag to build: pushed here, or typed in.
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            args: ""
            # LLVM's linker is several times faster than link.exe.
            linker: rust-lld.exe
            # sccache passes rustc one huge command line, which Windows
            # refuses ("filename or extension is too long"); use the
            # target cache there instead.
            no_sccache: true
          # One universal app for Apple silicon and Intel Macs: one Mac
          # runner instead of two (they're GitHub's scarcest machines).
          - name: macOS
            runner: macos-latest
            args: "--target universal-apple-darwin"
            rust_target: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            runner: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.runner }}
    env:
      # sccache caches each crate's compile output, so a release only
      # recompiles what changed, even when Cargo.lock changes.
      SCCACHE_GHA_ENABLED: ${{ matrix.no_sccache && 'false' || 'true' }}
      RUSTC_WRAPPER: ${{ !matrix.no_sccache && 'sccache' || '' }}
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ matrix.linker || '' }}
    steps:
      - name: Check out selfchat/client at ${{ env.TAG }}
        uses: actions/checkout@v4
        with:
          repository: selfchat/client
          ref: ${{ env.TAG }}
          ssh-key: ${{ secrets.APP_DEPLOY_KEY }}
          path: app

      - name: Read access to selfchat/server (selfchat-proto)
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_DEPLOY_KEY }}
      - run: git config --global url."git@github.com:selfchat/server".insteadOf "https://github.com/selfchat/server"

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev libasound2-dev

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: mozilla-actions/sccache-action@v0.0.9
        if: ${{ !matrix.no_sccache }}
      # Downloaded crates, plus compiled output where sccache isn't used.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.rust_target }}
          cache-targets: ${{ matrix.no_sccache && 'true' || 'false' }}

      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build only (test build)
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENSSL_SRC_PERL: ${{ runner.os == 'Windows' && 'C:\Strawberry\perl\bin\perl.exe' || 'perl' }}
        with:
          projectPath: app
          args: ${{ matrix.args }}

      - name: Build, sign and upload
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # OpenSSL (for SQLCipher) is built from source; use Strawberry Perl on Windows.
          OPENSSL_SRC_PERL: ${{ runner.os == 'Windows' && 'C:\Strawberry\perl\bin\perl.exe' || 'perl' }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          releaseName: selfchat ${{ env.TAG }}
          releaseBody: |
            Install it, pick a name, and send a friend your link. Already have selfchat? It updates itself.

            See the [README](https://github.com/selfchat/client-releases#first-launch) for first-launch notes on Windows and Mac.
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Compile cache hits
        if: ${{ always() && !matrix.no_sccache }}
        run: sccache --show-stats

  publish:
    name: Publish
    needs: build
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Release notes from the tag's message
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null || true)
          if [ "${ref%% *}" = "tag" ]; then
            gh api "repos/$REPO/git/tags/${ref#* }" --jq .message > notes.md
            {
              echo
              echo "---"
              echo "Already have selfchat? It updates itself. New here? See the [README](https://github.com/selfchat/client-releases#first-launch) for first-launch notes on Windows and Mac."
            } >> notes.md
            gh release edit "$TAG" -R "$REPO" --notes-file notes.md
          fi
      - name: Make the release public, so apps see the update
        run: gh release edit "$TAG" -R "$REPO" --draft=false --latest
