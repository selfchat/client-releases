name: Build and publish

# Builds a tagged version of selfchat/app for every platform, signs the
# updates, and publishes them here with the update feed (latest.json).
#
#   gh workflow run release.yml -R selfchat/releases -f tag=v0.1.0
#
# Test build of any branch, nothing published:
#   gh workflow run release.yml -R selfchat/releases -f tag=my-branch -f publish=false

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "selfchat/app tag to build, e.g. v0.1.0 (or a branch, for a test build)"
        required: true
      publish:
        description: "Publish a release. Off: build only, to test."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            args: ""
            # LLVM's linker is several times faster than link.exe.
            linker: rust-lld.exe
          - name: macOS (Apple silicon)
            runner: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - name: macOS (Intel)
            runner: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - name: Linux
            runner: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.runner }}
    env:
      # sccache caches each crate's compile output, so a release only
      # recompiles what changed, even when Cargo.lock changes.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ matrix.linker || '' }}
    steps:
      - name: Check out selfchat/app at ${{ inputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: selfchat/app
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.APP_DEPLOY_KEY }}
          path: app

      - name: Read access to selfchat/server (selfchat-proto)
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_DEPLOY_KEY }}
      - run: git config --global url."git@github.com:selfchat/server".insteadOf "https://github.com/selfchat/server"

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: mozilla-actions/sccache-action@v0.0.9
      # Downloaded crates and git checkouts; sccache handles compiled output.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.rust_target }}
          cache-targets: false

      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build only (test build)
        if: ${{ !inputs.publish }}
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENSSL_SRC_PERL: ${{ runner.os == 'Windows' && 'C:\Strawberry\perl\bin\perl.exe' || 'perl' }}
        with:
          projectPath: app
          args: ${{ matrix.args }}

      - name: Build, sign and upload
        if: ${{ inputs.publish }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # OpenSSL (for SQLCipher) is built from source; use Strawberry Perl on Windows.
          OPENSSL_SRC_PERL: ${{ runner.os == 'Windows' && 'C:\Strawberry\perl\bin\perl.exe' || 'perl' }}
        with:
          projectPath: app
          tagName: ${{ inputs.tag }}
          releaseName: selfchat ${{ inputs.tag }}
          releaseBody: |
            Install it, pick a name, and send a friend your link. Already have selfchat? It updates itself.

            See the [README](https://github.com/selfchat/releases#first-launch) for first-launch notes on Windows and Mac.
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Compile cache hits
        if: always()
        run: sccache --show-stats

  publish:
    name: Publish
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Make the release public, so apps see the update
        run: gh release edit "${{ inputs.tag }}" -R "${{ github.repository }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
