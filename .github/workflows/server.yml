name: Server release

# The public download of selfchat-server (selfchat/server is private).
#
# selfchat/server's release workflow pushes a server-vX.Y.Z tag here for
# each of its vX.Y.Z tags. That push starts this workflow, which builds
# that version from source and publishes a server-vX.Y.Z release with
# static Linux binaries (x86-64 and ARM64), the installer and the deploy
# files, and the setup guide (docs/setup.md) as its notes.
#
# To publish an existing version by hand: run this workflow with the tag,
# e.g. server-v0.11.0.

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. server-v0.11.0"
        required: true

permissions:
  contents: read

jobs:
  version:
    name: Which version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a tag like server-v0.11.0, got $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # server-v0.11.0 here is v0.11.0 in selfchat/server.
          echo "ref=refs/tags/${TAG#server-}" >> "$GITHUB_OUTPUT"

  # Static Linux binaries: musl, so they run on any distro, a Raspberry Pi
  # or a NAS, whatever its C library.
  binaries:
    name: Linux ${{ matrix.arch }} binary
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: selfchat/server
          ref: ${{ needs.version.outputs.ref }}
          ssh-key: ${{ secrets.SERVER_DEPLOY_KEY }}
          path: server
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p selfchat-server --locked --target ${{ matrix.arch }}-unknown-linux-musl
        working-directory: server
      - name: Name and checksum it
        run: |
          mkdir out
          cp server/target/${{ matrix.arch }}-unknown-linux-musl/release/selfchat-server out/selfchat-server-${{ matrix.arch }}-linux
          cd out && sha256sum selfchat-server-${{ matrix.arch }}-linux > selfchat-server-${{ matrix.arch }}-linux.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfchat-server-${{ matrix.arch }}-linux
          path: out/*

  publish:
    name: Publish
    needs: [version, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: selfchat/server
          ref: ${{ needs.version.outputs.ref }}
          ssh-key: ${{ secrets.SERVER_DEPLOY_KEY }}
          path: server
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Gather the installer and deploy files
        run: |
          cp server/deploy/install.sh server/deploy/selfchat.service server/deploy/docker-compose.yml server/deploy/Caddyfile out/
          (cd out && sha256sum install.sh > install.sh.sha256)
          ls -l out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file server/docs/setup.md
          else
            # Not marked latest: "latest" stays the newest app release, which
            # the app's updater reads.
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" \
              --title "selfchat-server ${TAG#server-v}" \
              --notes-file server/docs/setup.md \
              --latest=false
          fi
