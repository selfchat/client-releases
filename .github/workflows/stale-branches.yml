name: Remove stale branches

# Deletes branches with no commits for 30 days and no open pull request.
# Merged branches are already deleted by GitHub on merge. To keep a branch
# alive, open a draft pull request for it. See CONTRIBUTING.md.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, without deleting"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          MAX_AGE_DAYS: 30
        run: |
          set -euo pipefail
          default=$(gh api "repos/$REPO" --jq .default_branch)
          cutoff=$(date -u -d "$MAX_AGE_DAYS days ago" +%s)
          open_heads=$(gh pr list -R "$REPO" --state open --limit 500 --json headRefName --jq '.[].headRefName')
          gh api --paginate "repos/$REPO/branches" --jq '.[] | select(.protected | not) | .name' | while read -r branch; do
            [ "$branch" = "$default" ] && continue
            if grep -qxF "$branch" <<< "$open_heads"; then
              echo "keep  $branch (open pull request)"; continue
            fi
            last=$(gh api "repos/$REPO/commits/$(jq -rn --arg b "$branch" '$b|@uri')" --jq .commit.committer.date)
            if [ "$(date -u -d "$last" +%s)" -lt "$cutoff" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "would delete  $branch (last commit $last)"
              else
                gh api -X DELETE "repos/$REPO/git/refs/heads/$(jq -rn --arg b "$branch" '$b|@uri')"
                echo "deleted  $branch (last commit $last)"
              fi
            else
              echo "keep  $branch (last commit $last)"
            fi
          done
