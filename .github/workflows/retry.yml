name: Retry when GitHub has no runner

# GitHub sometimes has no Mac runner free and cancels the job ("not
# acquired by Runner"). When a release build fails only because a job was
# cancelled, run the failed jobs again, up to three attempts in all.

on:
  workflow_run:
    workflows: ["Build and publish"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.event.workflow_run.id }}
      REPO: ${{ github.repository }}
    steps:
      - name: Retry if a job was cancelled, not broken
        run: |
          set -euo pipefail
          failed=$(gh run view "$RUN" -R "$REPO" --json jobs --jq '[.jobs[] | select(.conclusion == "failure")] | length')
          cancelled=$(gh run view "$RUN" -R "$REPO" --json jobs --jq '[.jobs[] | select(.conclusion == "cancelled")] | length')
          if [ "$failed" = "0" ] && [ "$cancelled" != "0" ]; then
            echo "A job was cancelled (no runner). Trying again."
            gh run rerun "$RUN" -R "$REPO" --failed
          else
            echo "Real failure ($failed failed, $cancelled cancelled); not retrying."
          fi
